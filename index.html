<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5c4a'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23f4f1ea'%3E$%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fbf9f4;
    --ink: #1c1b18;
    --muted: #6d6a62;
    --line: #dcd7cb;
    --accent: #1f5c4a;
    --accent-ink: #f4f1ea;
    --bar: #cfe0d8;
    --danger: #a23b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141614;
      --card: #1c1f1c;
      --ink: #e9e6df;
      --muted: #9a978f;
      --line: #2e322e;
      --accent: #6fc3a4;
      --accent-ink: #10201a;
      --bar: #26392f;
      --danger: #e08a78;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.01em;
    margin: 0;
  }
  h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 28px 0 8px;
  }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .back {
    background: none;
    border: 0;
    color: var(--accent);
    font: inherit;
    padding: 10px 0;
    cursor: pointer;
  }
  .total {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 46px;
    line-height: 1.1;
    margin: 4px 0 14px;
    overflow-wrap: anywhere;
  }
  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
  }
  .seg button {
    flex: 1;
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 10px 4px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .btn {
    display: block;
    width: 100%;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    padding: 16px;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--accent);
    font-size: 16px;
    padding: 13px;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .stack > * + * { margin-top: 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { min-width: 0; overflow-wrap: anywhere; }
  .row .amt { white-space: nowrap; font-weight: 600; }
  .tally { padding: 12px 14px; }
  .tally + .tally { border-top: 1px solid var(--line); }
  .tally .line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .tally .track {
    height: 6px;
    border-radius: 3px;
    background: var(--bar);
    overflow: hidden;
  }
  .tally .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .tally .line .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tally .amt { min-width: 88px; text-align: right; white-space: nowrap; }
  .spark { flex: none; width: 84px; height: 24px; align-self: center; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--accent); }
  .chart { padding: 14px 14px 10px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .bar { fill: var(--accent); }
  .chart .bar.dim { opacity: 0.35; }
  .chart .base { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .ends { display: flex; justify-content: space-between; margin-top: 6px; }
  .chart .cap { margin-top: 8px; min-height: 21px; }
  .note { font-size: 14px; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { padding: 10px 14px; }
  .stat .v { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
  .empty { padding: 18px 14px; color: var(--muted); }
  .x {
    background: none;
    border: 0;
    color: var(--danger);
    font: inherit;
    font-size: 14px;
    padding: 8px 0 8px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  input, select {
    width: 100%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    font-size: 18px;
    padding: 14px;
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
    padding-right: 40px;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .money { position: relative; }
  .money span {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: Georgia, serif;
    font-size: 30px;
    color: var(--muted);
    pointer-events: none;
  }
  .money input {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 34px;
    padding: 14px 14px 14px 44px;
  }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; }
  .inline .btn { width: auto; font-size: 16px; padding: 0 20px; }
  .foot {
    margin-top: 32px;
    text-align: center;
    font-size: 14px;
  }
  .foot button {
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    padding: 10px;
    cursor: pointer;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    max-width: calc(100% - 32px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: #fff; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // Optional: paste your Supabase project URL and publishable key here to skip
  // the first-run setup screen. Both are safe to commit to a public repo, as
  // long as the row-level security policies from schema.sql are in place.
  const CONFIG = { url: "", key: "" };

  const STORE_KEY = "ledger.supabase";
  const LAST_CAT_KEY = "ledger.lastCategory";
  const DEFAULT = "Default";
  const PAGE = 1000;

  const app = document.getElementById("app");
  const toastEl = document.getElementById("toast");
  const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

  let sb = null;
  const state = { view: "loading", categories: [], expenses: [], period: "month", message: "", v2: true, sel: null, addKind: "expense", catKind: "expense" };

  // ---------- small helpers ----------

  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") n.className = v;
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? "" : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  }

  function svg(tag, attrs, ...kids) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat()) { if (kid) n.append(kid); }
    return n;
  }

  let toastTimer = null;
  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = "show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ""; }, isError ? 5000 : 2600);
  }

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

  function getConfig() {
    if (CONFIG.url && CONFIG.key) return CONFIG;
    try {
      const s = JSON.parse(lsGet(STORE_KEY) || "null");
      if (s && s.url && s.key) return s;
    } catch (e) {}
    return null;
  }

  function toCents(v) { return Math.round(Number(v) * 100); }
  function fmt(cents) { return money.format(cents / 100); }

  // Keep only digits and a single decimal point with at most two places.
  function cleanAmount(v) {
    v = v.replace(/[^0-9.]/g, "");
    const i = v.indexOf(".");
    if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2);
    return v;
  }

  // A deleted category has no match here, so its expenses fall back to Default.
  // Adding the category again brings them back, because the original name is kept.
  function effective(name, kind) {
    const key = String(name || "").trim().toLowerCase();
    const hit = state.categories.find((c) => c.kind === kind && c.name.toLowerCase() === key);
    return hit ? hit.name : DEFAULT;
  }

  function periodStart(period) {
    const now = new Date();
    if (period === "month") return new Date(now.getFullYear(), now.getMonth(), 1);
    if (period === "year") return new Date(now.getFullYear(), 0, 1);
    return null;
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }

  // The time slots the charts are drawn over: one per day for this month,
  // one per month for this year, and for all time whichever of the two fits.
  function buckets(period) {
    const now = new Date();
    let start = periodStart(period);
    let unit = period === "year" ? "month" : "day";
    if (!start) {
      if (!state.expenses.length) return { unit: "day", keys: [] };
      const first = new Date(state.expenses[state.expenses.length - 1].logged_at);
      start = new Date(first.getFullYear(), first.getMonth(), first.getDate());
      if ((now - start) / 86400000 > 62) { unit = "month"; start = new Date(start.getFullYear(), start.getMonth(), 1); }
    }
    const keys = [];
    const d = new Date(start);
    while (d <= now && keys.length < 400) {
      keys.push(unit === "day" ? dayKey(d) : monthKey(d));
      if (unit === "day") d.setDate(d.getDate() + 1); else d.setMonth(d.getMonth() + 1);
    }
    return { unit: unit, keys: keys };
  }

  function bucketLabel(key, unit) {
    const p = key.split("-").map(Number);
    const d = new Date(p[0], p[1] - 1, p[2] || 1);
    return unit === "day"
      ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      : d.toLocaleDateString(undefined, { month: "short", year: "numeric" });
  }

  function sparkline(values) {
    const W = 84, H = 24, P = 3;
    const max = Math.max.apply(null, values.concat([1]));
    const n = values.length;
    const x = (i) => (n === 1 ? W - P : P + (i * (W - 2 * P)) / (n - 1));
    const y = (v) => H - P - (v / max) * (H - 2 * P);
    const pts = values.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    return svg("svg", { class: "spark", viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" },
      n > 1 ? svg("polyline", { points: pts }) : null,
      svg("circle", { cx: x(n - 1), cy: y(values[n - 1]), r: 2.5 })
    );
  }

  function barChart(b, totals) {
    const W = 320, H = 110, n = b.keys.length;
    const max = Math.max.apply(null, totals.concat([1]));
    const slot = W / n;
    const bw = Math.max(2, Math.min(22, slot - 2));
    const unitWord = b.unit === "day" ? "day" : "month";
    const idle = "Total per " + unitWord + ", all categories. Tap a bar for its amount.";
    const cap = h("div", { class: "cap muted small", "aria-live": "polite" });
    const bars = [];
    function show() {
      const i = b.keys.indexOf(state.sel);
      bars.forEach((el, j) => { if (el) el.setAttribute("class", "bar" + (i !== -1 && j !== i ? " dim" : "")); });
      cap.textContent = i === -1 ? idle : bucketLabel(b.keys[i], b.unit) + ": " + fmt(totals[i]);
    }
    const kids = [];
    b.keys.forEach((key, i) => {
      const v = totals[i];
      const cx = slot * i + slot / 2;
      let el = null;
      if (v > 0) {
        const bh = Math.max(3, (v / max) * (H - 6));
        const r = Math.min(4, bw / 2, bh);
        const x0 = cx - bw / 2, x1 = cx + bw / 2, top = H - bh;
        el = svg("path", { class: "bar", d: "M" + x0 + "," + H + " V" + (top + r) + " Q" + x0 + "," + top + " " + (x0 + r) + "," + top +
          " H" + (x1 - r) + " Q" + x1 + "," + top + " " + x1 + "," + (top + r) + " V" + H + " Z" });
        kids.push(el);
      }
      bars.push(el);
    });
    b.keys.forEach((key, i) => {
      kids.push(svg("rect", { class: "hit", x: slot * i, y: 0, width: slot, height: H,
        onclick: () => { state.sel = state.sel === key ? null : key; show(); } }));
    });
    kids.push(svg("line", { class: "base", x1: 0, y1: H, x2: W, y2: H }));
    show();
    return h("div", { class: "card chart" },
      svg("svg", { viewBox: "0 0 " + W + " " + (H + 1), role: "img", "aria-label": "Bar chart of total spending per " + unitWord }, kids),
      h("div", { class: "ends muted small" },
        h("span", null, bucketLabel(b.keys[0], b.unit)),
        n > 1 ? h("span", null, bucketLabel(b.keys[n - 1], b.unit)) : null),
      cap
    );
  }

  function when(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function sortedCategories(kind) {
    return state.categories.filter((c) => c.kind === kind).sort((a, b) => a.name.localeCompare(b.name));
  }

  function go(view) {
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  // ---------- data ----------

  function missingColumn(err) {
    return !!err && (err.code === "42703" || err.code === "PGRST204" || /\b(note|kind)\b/i.test(err.message || ""));
  }
  function expenseCols() { return "id,category,amount,logged_at" + (state.v2 ? ",note,kind" : ""); }
  function categoryCols() { return "id,name" + (state.v2 ? ",kind" : ""); }

  async function fetchAll() {
    const cats = await sb.from("categories").select(categoryCols()).order("name");
    if (cats.error) throw cats.error;
    const all = [];
    for (let from = 0; ; from += PAGE) {
      const page = await sb.from("expenses")
        .select(expenseCols())
        .order("logged_at", { ascending: false })
        .range(from, from + PAGE - 1);
      if (page.error) throw page.error;
      all.push(...page.data);
      if (page.data.length < PAGE) break;
    }
    state.categories = cats.data.map((c) => Object.assign(c, { kind: c.kind || "expense" }));
    state.expenses = all.map((e) => Object.assign(e, { kind: e.kind || "expense" }));
  }

  async function loadData() {
    go("loading");
    try {
      try {
        await fetchAll();
      } catch (err) {
        // Notes and income need the columns added by migration_v2.sql. Until
        // that has been run, carry on with expenses only instead of failing.
        if (!state.v2 || !missingColumn(err)) throw err;
        state.v2 = false;
        await fetchAll();
      }
      go("home");
    } catch (err) {
      state.message = (err && err.message) || "Could not load your data.";
      go("error");
    }
  }

  async function addEntry(kind, category, cents, note) {
    const row = { category: category, amount: (cents / 100).toFixed(2), logged_at: new Date().toISOString() };
    if (state.v2) { row.kind = kind; if (note) row.note = note; }
    const res = await sb.from("expenses").insert(row).select(expenseCols()).single();
    if (res.error) throw res.error;
    res.data.kind = res.data.kind || "expense";
    state.expenses.unshift(res.data);
    return res.data;
  }

  async function deleteExpense(id) {
    const res = await sb.from("expenses").delete().eq("id", id);
    if (res.error) throw res.error;
    state.expenses = state.expenses.filter((e) => e.id !== id);
  }

  async function addCategory(name, kind) {
    const row = { name: name };
    if (state.v2) row.kind = kind;
    const res = await sb.from("categories").insert(row).select(categoryCols()).single();
    if (res.error) throw res.error;
    res.data.kind = res.data.kind || "expense";
    state.categories.push(res.data);
  }

  async function deleteCategory(id) {
    const res = await sb.from("categories").delete().eq("id", id);
    if (res.error) throw res.error;
    state.categories = state.categories.filter((c) => c.id !== id);
  }

  // ---------- views ----------

  function viewLoading() {
    return h("div", null, h("h1", null, "Ledger"), h("p", { class: "muted", style: "margin-top:16px" }, "Loading\u2026"));
  }

  function viewError() {
    return h("div", { class: "stack" },
      h("h1", null, "Ledger"),
      h("p", { style: "margin-top:16px" }, "Something went wrong: " + state.message),
      h("button", { class: "btn", onclick: loadData }, "Try again"),
      h("div", { class: "foot" }, h("button", { onclick: signOut }, "Sign out"))
    );
  }

  function viewSetup() {
    const url = h("input", { id: "url", type: "url", inputmode: "url", placeholder: "https://xxxx.supabase.co", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
    const key = h("input", { id: "key", type: "text", placeholder: "sb_publishable_\u2026", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
    function save(ev) {
      ev.preventDefault();
      const u = url.value.trim().replace(/\/+$/, "");
      const k = key.value.trim();
      if (!/^https:\/\/.+/.test(u)) { toast("The project URL should start with https://", true); return; }
      if (!k) { toast("Paste your publishable key.", true); return; }
      lsSet(STORE_KEY, JSON.stringify({ url: u, key: k }));
      init();
    }
    return h("form", { onsubmit: save },
      h("h1", null, "Connect Ledger"),
      h("p", { class: "muted", style: "margin-top:12px" }, "Paste the two values from your Supabase project. They are remembered on this device, so you only do this once per browser."),
      h("label", { for: "url" }, "Project URL"), url,
      h("label", { for: "key" }, "Publishable key"), key,
      h("div", { style: "margin-top:22px" }, h("button", { class: "btn", type: "submit" }, "Connect"))
    );
  }

  function viewSignin() {
    const email = h("input", { id: "email", type: "email", inputmode: "email", autocomplete: "username", autocapitalize: "off" });
    const pass = h("input", { id: "pass", type: "password", autocomplete: "current-password" });
    const btn = h("button", { class: "btn", type: "submit" }, "Sign in");
    async function submit(ev) {
      ev.preventDefault();
      btn.disabled = true;
      const res = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
      if (res.error) {
        btn.disabled = false;
        toast(res.error.message || "Sign in failed.", true);
        return;
      }
      loadData();
    }
    const kids = [
      h("h1", null, "Ledger"),
      h("p", { class: "muted", style: "margin-top:12px" }, "Sign in with the user you created in Supabase."),
      h("label", { for: "email" }, "Email"), email,
      h("label", { for: "pass" }, "Password"), pass,
      h("div", { style: "margin-top:22px" }, btn)
    ];
    if (!(CONFIG.url && CONFIG.key)) {
      kids.push(h("div", { class: "foot" }, h("button", { type: "button", onclick: () => { lsDel(STORE_KEY); sb = null; go("setup"); } }, "Change Supabase connection")));
    }
    return h("form", { onsubmit: submit }, kids);
  }

  function viewHome() {
    const start = periodStart(state.period);
    const b = buckets(state.period);
    const slotOf = new Map(b.keys.map((k, i) => [k, i]));
    const overall = b.keys.map(() => 0);
    const tot = { expense: new Map(), income: new Map() };
    const ser = { expense: new Map(), income: new Map() };
    const sum = { expense: 0, income: 0 };
    for (const e of state.expenses) {
      const at = new Date(e.logged_at);
      if (start && at < start) continue;
      const kind = e.kind;
      const cat = effective(e.category, kind);
      const cents = toCents(e.amount);
      tot[kind].set(cat, (tot[kind].get(cat) || 0) + cents);
      sum[kind] += cents;
      const i = slotOf.get(b.unit === "day" ? dayKey(at) : monthKey(at));
      if (i == null) continue;
      if (kind === "expense") overall[i] += cents;
      if (!ser[kind].has(cat)) ser[kind].set(cat, b.keys.map(() => 0));
      ser[kind].get(cat)[i] += cents;
    }

    const periods = [["month", "This month"], ["year", "This year"], ["all", "All time"]];
    const seg = h("div", { class: "seg", role: "group", "aria-label": "Period" },
      periods.map(([id, label]) => h("button", {
        type: "button",
        "aria-pressed": state.period === id ? "true" : "false",
        onclick: () => { state.period = id; state.sel = null; render(); }
      }, label))
    );

    function tally(kind, emptyText) {
      const rows = [...tot[kind].entries()].sort((a, b) => b[1] - a[1]);
      const max = rows.length ? rows[0][1] : 0;
      return h("div", { class: "card" },
        rows.length
          ? rows.map(([name, cents]) => h("div", { class: "tally" },
              h("div", { class: "line" }, h("span", { class: "name" }, name), ser[kind].has(name) ? sparkline(ser[kind].get(name)) : null, h("span", { class: "amt" }, fmt(cents))),
              h("div", { class: "track" }, h("div", { class: "fill", style: "width:" + (max ? Math.max(2, Math.round((cents / max) * 100)) : 0) + "%" }))
            ))
          : h("div", { class: "empty" }, emptyText)
      );
    }

    const recent = state.expenses.slice(0, 8);
    const recentCard = h("div", { class: "card" },
      recent.map((e) => {
        const income = e.kind === "income";
        const shown = (income ? "+" : "") + fmt(toCents(e.amount));
        return h("div", { class: "row" },
          h("div", { class: "name" },
            h("div", null, income ? h("span", { class: "tag" }, "Income") : null, effective(e.category, e.kind)),
            e.note ? h("div", { class: "note" }, e.note) : null,
            h("div", { class: "muted small" }, when(e.logged_at))
          ),
          h("div", { style: "display:flex;align-items:center;gap:6px" },
            h("span", { class: "amt" }, shown),
            h("button", { class: "x", type: "button", "aria-label": "Delete this entry", onclick: async () => {
              if (!confirm("Delete this " + shown + " entry?")) return;
              try { await deleteExpense(e.id); render(); toast("Entry deleted."); }
              catch (err) { toast(err.message || "Could not delete.", true); }
            } }, "Delete")
          )
        );
      })
    );

    const left = sum.income - sum.expense;
    const head = state.v2
      ? [
          h("div", { class: "muted small" }, "Left (income minus spending)"),
          h("div", { class: "total" }, (left < 0 ? "\u2212" : "") + fmt(Math.abs(left))),
          h("div", { class: "stats" },
            h("div", { class: "card stat" }, h("div", { class: "muted small" }, "Income"), h("div", { class: "v" }, fmt(sum.income))),
            h("div", { class: "card stat" }, h("div", { class: "muted small" }, "Spent"), h("div", { class: "v" }, fmt(sum.expense)))
          )
        ]
      : [
          h("div", { class: "muted small" }, "Total spent"),
          h("div", { class: "total" }, fmt(sum.expense))
        ];

    const open = (kind) => () => { state.addKind = kind; go("add"); };
    return h("div", null,
      h("div", { class: "top" }, h("h1", null, "Ledger")),
      head,
      seg,
      h("div", { class: "stack", style: "margin-top:18px" },
        h("button", { class: "btn", type: "button", onclick: open("expense") }, "Enter expense"),
        state.v2
          ? h("div", { class: "pair" },
              h("button", { class: "btn secondary", type: "button", onclick: open("income") }, "Enter income"),
              h("button", { class: "btn secondary", type: "button", onclick: () => go("categories") }, "Categories"))
          : h("button", { class: "btn secondary", type: "button", onclick: () => go("categories") }, "Edit categories")
      ),
      state.v2 ? null : h("p", { class: "muted small", style: "margin-top:14px" }, "Notes and income are switched off until migration_v2.sql has been run in Supabase."),
      sum.expense ? h("h2", null, "Spending over time") : null,
      sum.expense ? barChart(b, overall) : null,
      h("h2", null, "Spending by category"),
      tally("expense", state.expenses.some((e) => e.kind === "expense") ? "No spending logged in this period." : "Nothing logged yet. Enter your first expense above."),
      state.v2 ? h("h2", null, "Income by category") : null,
      state.v2 ? tally("income", "No income logged in this period.") : null,
      recent.length ? h("h2", null, "Recent entries") : null,
      recent.length ? recentCard : null,
      h("div", { class: "foot" }, h("button", { type: "button", onclick: signOut }, "Sign out"))
    );
  }

  function viewAdd() {
    const kind = state.addKind;
    const word = kind === "income" ? "income" : "expense";
    const last = lsGet(LAST_CAT_KEY + "." + kind);
    const names = [DEFAULT].concat(sortedCategories(kind).map((c) => c.name));
    const select = h("select", { id: "cat" },
      names.map((n) => h("option", { value: n, selected: n === last }, n))
    );
    const note = h("input", { id: "note", type: "text", maxlength: "250", placeholder: "Optional", autocomplete: "off", enterkeyhint: "next" });
    const amount = h("input", { id: "amt", type: "text", inputmode: "decimal", placeholder: "0.00", autocomplete: "off", enterkeyhint: "done" });
    const btn = h("button", { class: "btn", type: "submit", disabled: true }, "Log " + word);

    function cents() { const c = toCents(amount.value || 0); return Number.isFinite(c) ? c : 0; }
    amount.addEventListener("input", () => {
      const cleaned = cleanAmount(amount.value);
      if (cleaned !== amount.value) amount.value = cleaned;
      btn.disabled = cents() <= 0;
    });
    amount.addEventListener("blur", () => {
      if (cents() > 0) amount.value = (cents() / 100).toFixed(2);
    });

    async function submit(ev) {
      ev.preventDefault();
      const c = cents();
      if (c <= 0) return;
      btn.disabled = true;
      btn.textContent = "Logging\u2026";
      try {
        await addEntry(kind, select.value, c, note.value.trim().replace(/\s+/g, " ").slice(0, 250));
        lsSet(LAST_CAT_KEY + "." + kind, select.value);
        go("home");
        toast("Logged " + fmt(c) + (kind === "income" ? " of income under " : " to ") + select.value + ".");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Log " + word;
        toast(err.message || "Could not save. Check your connection.", true);
      }
    }

    setTimeout(() => amount.focus(), 0);
    return h("form", { onsubmit: submit },
      h("div", { class: "top" }, h("h1", null, "Enter " + word), h("button", { class: "back", type: "button", onclick: () => go("home") }, "Cancel")),
      h("label", { for: "cat" }, "Category"), select,
      state.v2 ? h("label", { for: "note" }, "Note") : null,
      state.v2 ? note : null,
      h("label", { for: "amt" }, "Amount"),
      h("div", { class: "money" }, h("span", { "aria-hidden": "true" }, "$"), amount),
      h("div", { style: "margin-top:22px" }, btn),
      h("p", { class: "muted small", style: "margin-top:14px" }, "The current time is recorded automatically when you log.")
    );
  }

  function viewCategories() {
    const kind = state.v2 ? state.catKind : "expense";
    const word = kind === "income" ? "income" : "expense";
    const input = h("input", { id: "newcat", type: "text", placeholder: "New " + word + " category", maxlength: "40", autocomplete: "off", enterkeyhint: "done" });
    async function submit(ev) {
      ev.preventDefault();
      const name = input.value.trim().replace(/\s+/g, " ");
      if (!name) return;
      const lower = name.toLowerCase();
      if (lower === DEFAULT.toLowerCase()) { toast("Default is always there, so it can't be added.", true); return; }
      if (state.categories.some((c) => c.kind === kind && c.name.toLowerCase() === lower)) { toast("You already have that category.", true); return; }
      try { await addCategory(name, kind); render(); toast("Added " + name + "."); }
      catch (err) { toast(err.message || "Could not add.", true); }
    }

    const cats = sortedCategories(kind);
    const list = h("div", { class: "card" },
      h("div", { class: "row" }, h("span", { class: "name" }, DEFAULT), h("span", { class: "muted small" }, "Always available")),
      cats.map((c) => h("div", { class: "row" },
        h("span", { class: "name" }, c.name),
        h("button", { class: "x", type: "button", onclick: async () => {
          if (!confirm("Delete \u201C" + c.name + "\u201D? Its past entries will be counted under Default.")) return;
          try { await deleteCategory(c.id); render(); toast("Deleted " + c.name + "."); }
          catch (err) { toast(err.message || "Could not delete.", true); }
        } }, "Delete")
      ))
    );

    const kinds = [["expense", "Expense"], ["income", "Income"]];
    return h("div", null,
      h("div", { class: "top" }, h("h1", null, "Categories"), h("button", { class: "back", type: "button", onclick: () => go("home") }, "Done")),
      state.v2 ? h("div", { class: "seg", role: "group", "aria-label": "Category type", style: "margin-bottom:14px" },
        kinds.map(([id, label]) => h("button", { type: "button", "aria-pressed": kind === id ? "true" : "false",
          onclick: () => { state.catKind = id; render(); } }, label))) : null,
      h("form", { class: "inline", onsubmit: submit }, input, h("button", { class: "btn", type: "submit" }, "Add")),
      h("h2", null, "Your " + word + " categories"),
      list,
      h("p", { class: "muted small", style: "margin-top:14px" }, "Deleting a category moves its past entries to Default. If you add the same name again later, that history comes back to it.")
    );
  }

  const views = {
    loading: viewLoading, error: viewError, setup: viewSetup, signin: viewSignin,
    home: viewHome, add: viewAdd, categories: viewCategories
  };

  function render() {
    app.replaceChildren((views[state.view] || viewLoading)());
  }

  // ---------- startup ----------

  async function signOut() {
    try { await sb.auth.signOut(); } catch (e) {}
    state.categories = [];
    state.expenses = [];
    go("signin");
  }

  async function init() {
    const cfg = getConfig();
    if (!cfg) { go("setup"); return; }
    if (!window.supabase || !window.supabase.createClient) {
      state.message = "the Supabase library did not load. Check your connection and reload.";
      go("error");
      return;
    }
    try {
      sb = window.supabase.createClient(cfg.url, cfg.key);
    } catch (err) {
      lsDel(STORE_KEY);
      go("setup");
      toast("That project URL or key doesn't look right.", true);
      return;
    }
    sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT" && state.view !== "signin" && state.view !== "setup") {
        setTimeout(() => go("signin"), 0);
      }
    });
    go("loading");
    const res = await sb.auth.getSession();
    if (!res.data || !res.data.session) { go("signin"); return; }
    loadData();
  }

  init();
})();
</script>
</body>
</html>
